[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "signalprep"
version = "1.0.0"
description = "A measured, grounded GenAI interview-practice system with hybrid retrieval and auditable scoring."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "numpy>=2.0",
  "pydantic>=2.9",
  "python-dotenv>=1.0",
  "python-multipart>=0.0.12",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
ui = ["gradio>=5.0"]
documents = ["pymupdf>=1.24"]
audio = ["soundfile>=0.12", "librosa>=0.10", "faster-whisper>=1.0"]
ml = [
  "faiss-cpu>=1.9",
  "sentence-transformers>=3.0",
  "transformers>=4.45",
  "torch>=2.4",
]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.8"]
all = [
  "gradio>=5.0", "pymupdf>=1.24", "soundfile>=0.12", "librosa>=0.10",
  "faster-whisper>=1.0", "faiss-cpu>=1.9", "sentence-transformers>=3.0",
  "transformers>=4.45", "torch>=2.4", "pytest>=8.0", "pytest-asyncio>=0.24",
]

[project.scripts]
signalprep-api = "interview_coach.api.app:run"

[tool.hatch.build.targets.wheel]
packages = ["src/interview_coach"]

[tool.hatch.build.targets.wheel.force-include]
"frontend/dist" = "interview_coach/frontend_dist"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]
