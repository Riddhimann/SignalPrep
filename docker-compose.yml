services:
  signalprep:
    build: .
    ports:
      - "8000:8000"
    environment:
      LLM_PROVIDER: ollama
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:3b}
      LLM_BASE_URL: http://host.docker.internal:11434
      RETRIEVAL_BACKEND: hybrid_ollama
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-hf.co/CompendiumLabs/bge-base-en-v1.5-gguf:latest}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
